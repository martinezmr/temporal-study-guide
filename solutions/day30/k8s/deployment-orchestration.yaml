apiVersion: apps/v1
kind: Deployment
metadata:
  name: netops-orchestration
  labels: { app: netops-worker, role: orchestration }
spec:
  replicas: 2
  selector:
    matchLabels: { app: netops-worker, role: orchestration }
  template:
    metadata:
      labels: { app: netops-worker, role: orchestration }
    spec:
      terminationGracePeriodSeconds: 45  # > graceful_shutdown_timeout (30 s)
      containers:
        - name: worker
          image: netops-worker
          command: ["python", "-m", "solutions.day29.workers"]
          args: ["orchestration"]
          envFrom:
            - configMapRef: { name: netops-worker-config }
            - secretRef: { name: netops-worker-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
