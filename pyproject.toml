[project]
name = "temporal-30-days"
version = "0.1.0"
description = "30 days of Temporal (Python) for network automation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "temporalio>=1.34",
    "pydantic>=2.9",
    "niquests>=3.21",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netops_temporal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
